# Modern SOTA Transformer Configuration (Optimal Production Settings)
architecture: "modern_transformer"
d_model: 512
encoder_layers: 8
decoder_layers: 4
heads: 8
kv_heads: 4                 # GQA: Grouped-Query Attention (+38.5% throughput speedup, saves KV cache)
encoder_d_ff: 1536          # Parameter-matched width across 8 encoder layers
d_ff: 2048
dropout: 0.1
max_seq_len: 2048

# Normalization & Embeddings
norm_type: "rmsnorm"
use_qk_norm: true           # QK-Norm prevents attention entropy collapse at lr=3e-4
tie_embeddings: true        # Cuts 20.48M parameters and gives shared Hindi token gradients
pos_embedding: "rope"       # Rotary Position Embeddings (RoPE)
ffn_type: "swiglu"          # Gated SwiGLU Feed-Forward Networks
use_gradient_checkpointing: false
model_folder: "modern_weights"
experiment_name: "runs/modern_transformer"

# High-Throughput Batching, Memmap & Hardware Acceleration
batch_size: 16
gradient_accumulation_steps: 6 # 4096 * 6 = ~24,576 tokens/step (Transformer-Base standard)
dynamic_padding: true
use_token_bucket_batching: true
max_tokens_per_batch: 4096  # Optimal sweet spot on 8 GB cards (~3.4 GB VRAM)
memmap_dir: "data/memmap/samanantar" # Zero-tokenization binary dataset (auto-falls back if not yet built)
memmap_src_variants: 2      # 2 offline source Akshara BPE-dropout variants
memmap_dropout_frac: 0.05   # 5% BPE dropout augmentation per epoch
use_packed_batches: false   # Padding efficiency already 99.8% with TokenBucket
use_chunked_ce: true        # Saves 90% peak logit VRAM via recomputed fused CE
ce_chunk_size: 1024
use_amp: true
amp_dtype: "bfloat16"
compile_model: false
num_workers: 4
prefetch_factor: 2

# Optimization & Regularization
optimizer: "adamw"
lr: 3.0e-4
lr_schedule: "cosine"
warmup_steps: 4000
auto_scale_warmup: true     # Automatically caps warmup to 5-8% of total optimizer steps
weight_decay: 0.01
decay_embeddings: false     # Excludes embeddings, norms, and biases from weight decay
z_loss: 1.0e-4              # Prevents logit drift under BF16 autocast
gradient_clip_norm: 1.0
label_smoothing: 0.1
# Keep rdrop_alpha=0.0 during pretraining; set to 0.3 for the final 1-2 fine-tuning epochs
rdrop_alpha: 0.0
use_ema: true
ema_decay: 0.9999           # Smoothly ramps via (1+step)/(10+step) from epoch 1
average_last_k: 5           # Tail checkpoint averaging across cosine decay

# Translation Precision & Robustness
use_placeholders: true      # Preserves numbers and URLs across translation
use_grammar_mask: true      # Devanagari grammar mask prevents illegal matra/virama sequences
val_size_limit: 2000
leakage_check_samples: 5000

# Fast Decoding & Beam Search
default_decoding_strategy: "fast_beam"
use_kv_cache: true
beam_size: 4
length_penalty_alpha: 0.6
coverage_penalty_beta: 0.2
